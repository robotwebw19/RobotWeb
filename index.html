<html lang="th">
  <head>

    <!-- Kanit — the site's one UI font (Thai + Latin), everywhere except the code editor/console,
         which stay monospace on purpose. Falls back to system fonts below if the classroom network
         can't reach Google Fonts, so the app never ships unreadable/blank text either way. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      THESIS: This app IS the circuit board the student is coding for — every panel reads as a
      populated PCB island, not app chrome wrapped around a robotics product.
      OWN-WORLD: Arduino-teal soldermask ground, copper/gold plating as the one interactive signal,
      white silkscreen ink for text, plated mounting-hole corners on every card, a faint drilled
      via-grid under a slow teal sweep; real through-hole LED colors (amber/red/green) for status,
      unchanged from before — those are literal component colors, not part of the bezel that changed.
      STORY: a student opens a workbench that visibly looks like the board they're programming, and
      reads status the way they'd read populated LEDs and a soldered digit module, not a dashboard.
      FIRST VIEWPORT: the run screen — a three-island board (level/config, simulation canvas as the
      test bench, code+console) bordered in copper hairlines, its HUD a genuine 7-segment module.
      FORM: "The Silkscreen" — grounded candidate 7, passed over for The Scoreboard at seed key
      444573ff, reinstated at explicit user request (2026-08-17), built at Arduino.cc/KiCad
      official-tool craft level rather than the rut's laziest reading.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
